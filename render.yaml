services:
  # Django Web Service
  - type: web
    name: church-qa-web
    env: python

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn church_qa.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "church-qa-web.onrender.com"

      # Set manually in Render Dashboard
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: church-qa-redis
          property: connectionString

      - key: WHATSAPP_API_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: CHURCH_NAME
        value: "My Church"

      - key: CHURCH_TAGLINE
        value: "Ask questions about our sermons"

  # Celery Worker
  - type: worker
    name: church-qa-worker
    env: python

    buildCommand: pip install -r requirements.txt

    startCommand: celery -A church_qa worker --loglevel=info --concurrency=2

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: church-qa-redis
          property: connectionString

      - key: SECRET_KEY
        fromService:
          type: web
          name: church-qa-web
          envVarKey: SECRET_KEY

      - key: WHATSAPP_API_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  # Redis
  # - type: redis
  #   name: church-qa-redis
  #   plan: free