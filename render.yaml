services:
  # Django Web Service
  - type: web
    name: church-qa-web
    runtime: python
    region: oregon

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn church_qa.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: CLOUDFLARE_API_TOKEN
        sync: false

      - key: CLOUDFLARE_ZONE_ID
        sync: false

      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: church-qa-db
          property: connectionString

      - key: WHATSAPP_API_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: CHURCH_NAME
        value: "My Church"

      - key: CHURCH_TAGLINE
        value: "Ask questions about our sermons"

databases:
  - name: church-qa-db
    databaseName: church_qa
    user: church_qa
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []
